name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. Let a running deployment finish
# instead of cancelling it halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/prototype _site/tokens
          # The prototype uses ../tokens/css/tokens.css, so keep the same
          # directory layout as in the repository.
          cp -R prototype/. _site/prototype/
          cp -R tokens/. _site/tokens/
          # Root landing page redirects to the prototype.
          cp index.html _site/index.html

      - name: Verify build output
        run: |
          set -euo pipefail
          for file in \
            _site/index.html \
            _site/prototype/index.html \
            _site/prototype/styles.css \
            _site/prototype/app.js \
            _site/tokens/css/tokens.css \
            _site/tokens/tokens.json; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required site file is missing or empty"
              exit 1
            fi
          done
          # Catch accidental domain-root absolute paths that would 404 under
          # https://<owner>.github.io/<repo>/.
          if grep -RnE '(href|src)="/[^/]' _site --include='*.html'; then
            echo "::error::Found root-absolute asset paths; use relative paths for project Pages"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
